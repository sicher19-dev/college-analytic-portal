<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>College Hitting Dashboard · No Brand Baseball Analytics</title>
<meta name="description" content="Sample college hitting dashboard by No Brand Baseball Analytics: team page, weekly hitter cards, opponent plans, practice scoring and roster reads. Fictional players and data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#07090C; --panel:#0C1218; --panel2:#101820; --line:#1E2A35; --grid:#18232D;
  --cyan:#39C5F0; --cyan-d:#21708C; --cyan-t:#0E2A36; --amber:#FFB347; --amber-t:#33240F; --coral:#FF7B67; --coral-t:#3A1712;
  --ink:#EAF0F4; --ink2:#B8C4CF; --ink3:#8E9DAC;
  --fd:'Barlow Condensed','Arial Narrow',sans-serif; --fb:'Barlow','Helvetica Neue',Arial,sans-serif; --fm:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.45}
a{color:var(--cyan);text-decoration:none}
a:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.sample{background:var(--amber-t);color:var(--amber);font-family:var(--fd);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:12.5px;text-align:center;padding:6px 12px}
header.top{border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.nb{display:flex;align-items:center;justify-content:center;width:38px;height:28px;border:1.5px solid var(--cyan);color:var(--cyan);font-family:var(--fd);font-weight:800;font-size:17px;letter-spacing:.04em;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.brand-name{font-family:var(--fd);font-weight:700;font-size:15px;letter-spacing:.18em}
.meta{font-family:var(--fd);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.meta b{color:var(--cyan);font-weight:700}
nav.tabs{position:sticky;top:0;z-index:5;background:rgba(7,9,12,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;font-family:var(--fd);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);padding:14px 12px 11px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--cyan)}
main{padding:22px 0 40px}
footer{border-top:1px solid var(--line);color:var(--ink3);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:16px;padding-bottom:22px}
/* type */
.lbl{font-family:var(--fd);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);line-height:1.2}
.lbl.c{color:var(--cyan)}.lbl.a{color:var(--amber)}.lbl.r{color:var(--coral)}.lbl.i{color:var(--ink)}
.h1{font-family:var(--fd);font-weight:800;font-size:clamp(36px,6vw,54px);line-height:.95;text-transform:uppercase;letter-spacing:.005em;margin:0}
.h2{font-family:var(--fd);font-weight:800;font-size:clamp(26px,4vw,34px);line-height:1;text-transform:uppercase;margin:0}
.h3{font-family:var(--fd);font-weight:700;font-size:18px;line-height:1.1;text-transform:uppercase;letter-spacing:.03em;margin:0}
.sub{font-family:var(--fd);font-weight:600;font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.muted{color:var(--ink3)}.ink2{color:var(--ink2)}
.mono{font-family:var(--fm)}
.small{font-size:13px}.xs{font-size:12px}
.c-cyan{color:var(--cyan)}.c-coral{color:var(--coral)}.c-amber{color:var(--amber)}.c-ink{color:var(--ink)}
p{margin:0}
/* layout */
.row{display:flex;gap:14px;flex-wrap:wrap}
.grow{flex:1 1 300px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.head-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.wk{font-family:var(--fd);font-weight:800;font-size:34px;color:var(--cyan);line-height:.9;letter-spacing:.02em}
.mt{margin-top:14px}.mt2{margin-top:22px}.mb{margin-bottom:10px}
/* frames */
.frame{background:var(--cyan-d);padding:1px;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.frame>.in{background:var(--panel);clip-path:polygon(13.5px 0,100% 0,100% calc(100% - 13.5px),calc(100% - 13.5px) 100%,0 100%,0 13.5px);padding:14px 16px;height:100%}
.frame.flag{background:var(--coral)}.frame.flag>.in{background:var(--coral-t)}
.frame.watch{background:var(--coral)}
.frame.amber{background:var(--amber)}
.frame.sm>.in{padding:11px 12px}
/* chips */
.chip{display:inline-block;font-family:var(--fd);font-weight:700;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid currentColor;padding:2px 7px 1px;line-height:1.3;white-space:nowrap}
.chip.cyan{color:var(--cyan);background:var(--cyan-t)}.chip.coral{color:var(--coral);background:var(--coral-t)}.chip.amber{color:var(--amber);background:var(--amber-t)}.chip.plain{color:var(--ink2)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.tile .big{font-family:var(--fm);font-weight:500;font-size:30px;letter-spacing:-.02em;line-height:1;margin-top:6px}
.tile .big small{font-size:14px;color:var(--ink3);margin-left:3px;font-weight:500}
.tile .l2{font-size:13px;color:var(--ink2);margin-top:6px}
.tile .l3{font-size:12px;color:var(--ink3);margin-top:1px}
.strip{display:flex;gap:26px;flex-wrap:wrap;padding:9px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:14px}
.strip .mono{font-size:15px}
/* tables */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse}
table.t th{font-family:var(--fd);font-weight:700;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);text-align:right;padding:6px 7px;border-bottom:1px solid var(--cyan-d);white-space:nowrap}
table.t td{padding:6px 7px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-size:13.5px}
table.t .l{text-align:left}
table.t td.n{font-family:var(--fm);font-size:13px;color:var(--ink2)}
table.t tr.dim td{color:var(--ink3)}
table.t th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
table.t th button:hover{color:var(--ink)}
table.t th button.on{color:var(--cyan)}
table.t th button:focus-visible{outline:2px solid var(--cyan)}
.mk{display:inline-block;width:8px;height:8px;margin-left:6px;vertical-align:1px}
.mk.bad{background:var(--coral)}.mk.good{background:var(--cyan);border-radius:50%}
.seg{display:inline-flex;border:1px solid var(--cyan-d)}
.seg button{background:transparent;border:0;padding:5px 11px;font-family:var(--fd);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--cyan-t);color:var(--cyan)}
/* lists */
.flag-row{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line);align-items:baseline}
.flag-row .who{width:122px;flex:none;font-family:var(--fd);font-weight:700;font-size:14.5px;letter-spacing:.03em;text-transform:uppercase}
.flag-row .what{font-size:13.5px;color:var(--ink2)}
.bul{display:flex;flex-direction:column;gap:7px;margin:0;padding:0;list-style:none}
.bul li{display:flex;gap:10px;align-items:baseline;color:var(--ink2);font-size:14.5px}
.bul li::before{content:"";flex:none;width:6px;height:6px;background:var(--cyan);transform:translateY(-2px)}
.bul.a li::before{background:var(--amber)}
/* plan */
.fix{display:grid;grid-template-columns:26px minmax(0,1fr) 110px 110px 190px;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.fix .no{font-family:var(--fd);font-weight:800;font-size:24px;color:var(--cyan);line-height:1}
.fix .v{font-family:var(--fm);font-size:13.5px;text-align:right}
.fix .why{font-size:12.5px;color:var(--ink3);margin-top:4px}
.fix-h{display:grid;grid-template-columns:26px minmax(0,1fr) 110px 110px 190px;gap:10px;padding-bottom:6px}
.fix-h div{font-family:var(--fd);font-weight:700;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
/* cards grid */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.hcard{display:block;color:inherit}
.hcard:hover .frame{background:var(--cyan)}
.hcard .nm{font-family:var(--fd);font-weight:800;font-size:22px;text-transform:uppercase;line-height:1;color:var(--ink)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.kv .k{font-family:var(--fd);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.kv .v{font-family:var(--fm);font-size:16px;color:var(--ink)}
.prog{height:8px;background:var(--grid);margin-top:6px}
.prog>div{height:8px;background:var(--cyan)}
/* bars */
.bar{flex:1;height:10px;background:var(--grid)}
.bar>div{height:10px}
.mix{display:flex;height:17px}
.mix>div{display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:12px;color:var(--bg);font-weight:600;overflow:hidden}
.board-row{display:flex;align-items:center;gap:10px;padding:5px 6px;cursor:pointer;border:1px solid transparent;width:100%;background:transparent;text-align:left}
.board-row:hover{border-color:var(--cyan-d)}
.board-row[aria-pressed="true"]{border-color:var(--cyan);background:var(--cyan-t)}
.callout{background:var(--cyan-t);padding:12px 14px;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);font-family:var(--fd);font-weight:700;font-size:20px;line-height:1.15}
.callout.a{background:var(--amber-t)}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--fb)}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:9px;height:9px}
.crumbs{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--fd);font-weight:700;font-size:13.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);border:1px solid var(--cyan-d);padding:6px 11px;background:transparent;cursor:pointer}
.btn:hover{color:var(--ink);border-color:var(--cyan)}
.prod{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:12px}
.num{font-family:var(--fm);font-size:13px;color:var(--cyan);flex:none;padding-top:2px}
@media (max-width:980px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .fix,.fix-h{grid-template-columns:24px minmax(0,1fr) 92px 92px}
  .fix .st,.fix-h .st{grid-column:2 / -1}}
@media (max-width:600px){.wrap{padding:0 14px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles>:last-child:nth-child(odd){grid-column:span 2}
  .fix{grid-template-columns:22px minmax(0,1fr);row-gap:4px}.fix-h{display:none}
  .fix .v,.fix .st{grid-column:2;text-align:left}
  .fix .v::before{content:attr(data-label) " · ";color:var(--ink3);font-family:var(--fb);font-size:12.5px}
  .flag-row .who{width:96px}
  .head-r{align-items:flex-start}}
@media print{
  @page{size:letter;margin:.35in}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:12px}
  .sample,nav.tabs,footer,.no-print{display:none!important}
  main{padding:0}
  .wrap{max-width:none;padding:0}
  .frame{break-inside:avoid}
}
</style>
</head>

<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById("nb-data").textContent);
const H = DATA.hitters, BY = {};
H.forEach(h => BY[h.slug] = h);
const REG = H.filter(h => h.regular);
const C = {cyan:"#39C5F0", cyanD:"#21708C", cyanT:"#0E2A36", amber:"#FFB347", coral:"#FF7B67", ink:"#EAF0F4", ink2:"#B8C4CF", ink3:"#8E9DAC", grid:"#18232D", line:"#1E2A35", bg:"#07090C", panel2:"#101820"};
const state = {sort: null, dir: -1, scope: "season", spray: "week", practice: "danny-ortega"};
const POS = {C:"Catcher","1B":"First base","2B":"Second base","3B":"Third base",SS:"Shortstop",LF:"Left field",CF:"Center field",RF:"Right field",DH:"Designated hitter",UT:"Utility",OF:"Outfield"};

/* ---------- helpers ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r0 = x => { const f = Math.floor(x), d = x - f; return Math.abs(d - 0.5) < 1e-9 ? (f % 2 === 0 ? f : f + 1) : Math.round(x); };  // same rounding as the printed pages
const pct = v => v == null ? "—" : r0(v) + "%";
const inch = v => v == null ? "—" : (v >= 0 ? "+" : "") + v.toFixed(1);
const sl = v => v == null ? "—" : (v < 1 ? v.toFixed(3).slice(1) : v.toFixed(3));
const ord = r => r + (r % 100 >= 11 && r % 100 <= 13 ? "th" : ({1:"st",2:"nd",3:"rd"}[r % 10] || "th"));
const frame = (inner, cls = "", style = "") => `<div class="frame ${cls}" style="${style}"><div class="in">${inner}</div></div>`;
const lbl = (t, c = "") => `<div class="lbl ${c}">${esc(t)}</div>`;
const chip = (t, c) => `<span class="chip ${c}">${esc(t)}</span>`;
const STATUS = {confirmed:["Confirmed in games","cyan"], notyet:["Not yet","coral"], few:["Too few to call","amber"]};
const slash = s => `${sl(s.AVG)} / ${sl(s.OBP)} / ${sl(s.SLG)}`;
const flagKinds = name => { const k = new Set(); (DATA.team.flags || []).forEach(f => { if (f.name === name) k.add(f.kind); }); return k; };
const marks = name => { const k = flagKinds(name); return (k.has("bad") ? '<span class="mk bad" title="On the watch list"></span>' : "") + (k.has("good") ? '<span class="mk good" title="Good sign"></span>' : ""); };
const planOf = h => h.plan ? {c: h.plan.filter(f => f.status === "confirmed").length, t: h.plan.length} : null;

/* ---------- charts ---------- */
function svgText(x, y, t, o = {}) {
  const st = `font-family:${o.fam || "var(--fb)"};font-size:${o.size || 12}px;fill:${o.color || C.ink3};text-anchor:${o.anchor || "start"};font-weight:${o.weight || 500};${o.ls ? "letter-spacing:" + o.ls : ""}`;
  return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" style="${st}">${esc(t)}</text>`;
}
const FD = "'Barlow Condensed','Arial Narrow',sans-serif", FM = "'IBM Plex Mono',ui-monospace,monospace";
const narrow = () => window.innerWidth < 640;
function driftChart(games, cage, target, W = 560, Hh = 230) {
  const L = 42, R = 16, T = 16, B = 42;
  const vals = games.map(g => g.v).concat((cage || []).map(c => c.v), [target]).filter(v => v != null);
  let lo = Math.min(0, Math.floor(Math.min(...vals) - 1)), hi = Math.max(10, Math.ceil(Math.max(...vals) + 1));
  if (lo % 2) lo -= 1; if (hi % 2) hi += 1;
  const tick = (hi - lo) > 14 ? 4 : 2;
  const step = (W - L - R) / (games.length - 1 + 0.5);
  const px = {}; games.forEach((g, i) => px[g.lbl] = L + step * (i + 0.25));
  const sy = v => T + (1 - (v - lo) / (hi - lo)) * (Hh - T - B);
  let g = "";
  for (let v = lo; v <= hi; v += tick) {
    g += `<line x1="${L}" y1="${sy(v).toFixed(1)}" x2="${W - R}" y2="${sy(v).toFixed(1)}" style="stroke:${C.grid};stroke-width:1"/>`;
    g += svgText(L - 8, sy(v) + 4, v > 0 ? "+" + v : String(v), {anchor: "end", fam: FM});
  }
  g += `<line x1="${L}" y1="${sy(target).toFixed(1)}" x2="${W - R}" y2="${sy(target).toFixed(1)}" style="stroke:${C.cyan};stroke-width:1.2;stroke-dasharray:5 4;opacity:.9"/>`;
  g += svgText(L + 6, sy(target) + 15, "TARGET +" + target, {color: C.cyan, weight: 700, fam: FD, ls: ".08em"});
  if (cage && cage.length) {
    const cp = cage.filter(c => c.v != null).map(c => [px[c.lbl], sy(c.v)]);
    g += `<polyline points="${cp.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ")}" style="fill:none;stroke:${C.amber};stroke-width:1.6;stroke-dasharray:2 3"/>`;
    cp.forEach(p => g += `<rect x="${(p[0] - 3.5).toFixed(1)}" y="${(p[1] - 3.5).toFixed(1)}" width="7" height="7" style="fill:${C.bg};stroke:${C.amber};stroke-width:1.4"/>`);
  }
  const gp = games.filter(x => x.v != null).map(x => [px[x.lbl], sy(x.v), x]);
  g += `<polyline points="${gp.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ")}" style="fill:none;stroke:${C.ink2};stroke-width:1.8"/>`;
  const last = games[games.length - 1];
  gp.forEach(([x, y, d]) => {
    const isLast = d === last, slip = isLast && games.length > 1 && d.v != null;
    const col = isLast ? (DATA._slip ? C.coral : C.ink) : C.ink;
    g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${isLast ? 5.5 : 4.5}" style="fill:${col}"/>`;
    g += svgText(x, y + 19, inch(d.v), {anchor: "middle", color: col, weight: 600, fam: FM});
  });
  games.forEach(d => {
    const x = px[d.lbl];
    g += svgText(x, Hh - 22, d.lbl.toUpperCase(), {anchor: "middle", color: C.ink2, weight: 700, fam: FD, ls: ".08em"});
    g += svgText(x, Hh - 8, d.n ? d.n + " contacts" : "no contacts", {anchor: "middle", weight: 400});
  });
  return `<svg viewBox="0 0 ${W} ${Hh}" width="${W}" height="${Hh}" role="img" aria-label="Contact point against 90+ fastballs by week">${g}</svg>`;
}
function sprayChart(points, bats, W = 300, Hh = 250) {
  const hx = W / 2, hy = Hh - 14, s = (Hh - 30) / 400;
  const P = (d, a) => { const r = a * Math.PI / 180; return [hx + d * Math.sin(r) * s, hy - d * Math.cos(r) * s]; };
  const fence = a => 400 - 70 * Math.pow(Math.abs(a) / 45, 1.2);
  let g = "";
  const arc = []; for (let a = -45; a <= 45; a += 3) arc.push(P(fence(a), a));
  g += `<path d="M ${hx} ${hy} L ${arc.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L ")} Z" style="fill:${C.panel2};stroke:${C.cyanD};stroke-width:1.2"/>`;
  [150, 250].forEach(d => { const pts = []; for (let a = -45; a <= 45; a += 5) pts.push(P(d, a)); g += `<polyline points="${pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ")}" style="fill:none;stroke:${C.grid};stroke-width:1"/>`; });
  const b1 = P(90, 45), b2 = P(127.3, 0), b3 = P(90, -45);
  g += `<polygon points="${hx},${hy} ${b1.join(",")} ${b2.join(",")} ${b3.join(",")}" style="fill:none;stroke:${C.ink3};stroke-width:1;opacity:.6"/>`;
  points.forEach(p => {
    const ang = bats === "R" ? -p.pull : p.pull;
    const [x, y] = P(Math.min(p.dist, fence(ang) + 12), ang);
    if (p.la > 50) g += `<rect x="${(x - 4).toFixed(1)}" y="${(y - 4).toFixed(1)}" width="8" height="8" style="fill:${C.bg};stroke:${C.amber};stroke-width:1.6"><title>Pop-up · ${p.ev} mph, ${p.la}°</title></rect>`;
    else if (p.ev >= 95) g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" style="fill:${C.cyan}"><title>${p.ev} mph, ${p.la}° · ${p.res === "out" ? "out" : p.res}</title></circle>`;
    else g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" style="fill:${C.bg};stroke:${C.ink2};stroke-width:1.4"><title>${p.ev} mph, ${p.la}° · ${p.res === "out" ? "out" : p.res}</title></circle>`;
    if (p.res === "HR") g += svgText(x + 8, y + 4, "HR", {color: C.cyan, weight: 700, fam: FD});
  });
  return `<svg viewBox="0 0 ${W} ${Hh}" width="${W}" height="${Hh}" role="img" aria-label="Balls in play">${g}</svg>`;
}
function scatterChart(pr, W = 560, Hh = 280) {
  const L = 40, R = 10, T = 24, B = 46, x0 = -4, x1 = 16, y0 = -20, y1 = 75;
  const sx = v => L + (v - x0) / (x1 - x0) * (W - L - R), sy = v => T + (1 - (v - y0) / (y1 - y0)) * (Hh - T - B);
  let g = "";
  g += `<rect x="${sx(x0)}" y="${sy(y1)}" width="${sx(4) - sx(x0)}" height="${sy(y0) - sy(y1)}" style="fill:${C.coral};opacity:.10"/>`;
  g += `<rect x="${sx(8)}" y="${sy(y1)}" width="${sx(x1) - sx(8)}" height="${sy(y0) - sy(y1)}" style="fill:${C.cyan};opacity:.08"/>`;
  g += `<rect x="${sx(x0)}" y="${sy(25)}" width="${sx(x1) - sx(x0)}" height="${sy(10) - sy(25)}" style="fill:${C.ink};opacity:.05"/>`;
  [-20, 0, 25, 50, 75].forEach(v => { g += `<line x1="${sx(x0)}" y1="${sy(v)}" x2="${sx(x1)}" y2="${sy(v)}" style="stroke:${C.grid}"/>` + svgText(L - 7, sy(v) + 4, v + "°", {anchor: "end", fam: FM}); });
  [-4, 0, 4, 8, 12, 16].forEach(v => { g += svgText(sx(v), sy(y0) + 17, v > 0 ? "+" + v : String(v), {anchor: "middle", fam: FM}); });
  g += `<line x1="${sx(x0)}" y1="${sy(50)}" x2="${sx(x1)}" y2="${sy(50)}" style="stroke:${C.amber};stroke-dasharray:4 3;opacity:.8"/>`;
  g += svgText(sx(0), sy(y1) - 8, "LATE · UNDER +4", {anchor: "middle", color: C.coral, weight: 700, fam: FD, ls: ".1em"});
  g += svgText((sx(8) + sx(x1)) / 2, sy(y1) - 8, "ON TIME · +8 OR MORE", {anchor: "middle", color: C.cyan, weight: 700, fam: FD, ls: ".1em"});
  if (pr.fit) { const [b, a] = pr.fit; g += `<line x1="${sx(-1.5)}" y1="${sy(a + b * -1.5)}" x2="${sx(15)}" y2="${sy(a + b * 15)}" style="stroke:${C.ink2};stroke-width:1.5;stroke-dasharray:6 4;opacity:.9"/>`; }
  (pr.fouls || []).forEach(d => { if (d >= x0 && d <= x1) g += `<line x1="${sx(d)}" y1="${sy(y0) - 9}" x2="${sx(d)}" y2="${sy(y0) - 1}" style="stroke:${C.ink3};stroke-width:1.4;opacity:.9"/>`; });
  (pr.points || []).forEach(p => { if (p.d < x0 || p.d > x1) return; const hard = p.ev >= 95, y = sy(Math.max(Math.min(p.la, y1 - 1), y0 + 1));
    g += hard ? `<circle cx="${sx(p.d)}" cy="${y}" r="4.2" style="fill:${C.cyan}"><title>${p.d} in., ${p.la}°, ${p.ev} mph</title></circle>` : `<circle cx="${sx(p.d)}" cy="${y}" r="4.2" style="fill:${C.bg};stroke:${C.ink2};stroke-width:1.4"><title>${p.d} in., ${p.la}°, ${p.ev} mph</title></circle>`; });
  g += svgText((L + W - R) / 2, Hh - 8, "CONTACT POINT · INCHES OUT FRONT OF THE PLATE", {anchor: "middle", weight: 600, fam: FD, ls: ".1em"});
  return `<svg viewBox="0 0 ${W} ${Hh}" width="${W}" height="${Hh}" role="img" aria-label="Launch angle by contact point on fastballs up">${g}</svg>`;
}

/* ---------- shared blocks ---------- */
function tile(label, big, unit, l2, l3, flag) {
  return frame(`${lbl(label, flag ? "r" : "")}<div class="big" style="color:${flag ? C.coral : C.ink}">${esc(big)}${unit ? `<small>${esc(unit)}</small>` : ""}</div><div class="l2">${l2}</div>${l3 ? `<div class="l3">${l3}</div>` : ""}`, "sm tile" + (flag ? " flag" : ""));
}
function planBlock(h) {
  if (!h.plan) return frame(`${lbl("Development plan", "i")}<p class="mt small ink2">Development plans cover the everyday lineup. Weekly cards cover everyone on the roster.</p>`);
  const rows = h.plan.map(f => {
    const [st, sc] = STATUS[f.status];
    const gc = f.games_ok == null ? C.ink2 : (f.games_ok ? C.cyan : C.coral);
    return `<div class="fix"><div class="no">${f.n}</div>
      <div><div class="h3">${esc(f.title)}</div><div class="small muted" style="margin-top:3px">${esc(f.target_text)}</div><div class="xs ink2" style="margin-top:5px">${esc(f.drills)}</div></div>
      <div class="v" data-label="Cage this week" style="color:${f.cage_ok ? C.cyan : C.coral}">${esc(f.cage)}</div>
      <div class="v" data-label="Games, season" style="color:${gc}">${esc(f.games)}</div>
      <div class="st">${chip(st, sc)}<div class="why">${esc(f.why)}</div></div></div>`;
  }).join("");
  return frame(`<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap" class="mb">${lbl("His plan · cage this week next to games", "i")}<span class="xs muted">A fix counts when it shows up in games.</span></div>
    <div class="fix-h"><div></div><div>Fix · target · drills</div><div style="text-align:right">Cage this wk</div><div style="text-align:right">Games, season</div><div class="st">Status</div></div>${rows}`);
}
function splitsBlock(h) {
  const names = {"FB 90+":"Fastball 90+","FB <90":"Fastball under 90","Breaking":"Breaking ball","Changeup":"Changeup"};
  const rows = Object.keys(names).map(k => { const a = h.splits_week[k], b = h.splits_season[k];
    return `<tr><td class="l">${names[k]}</td><td class="n">${a.seen}</td><td class="n">${a.swings}</td><td class="n">${a.whiffs} <span class="muted">(${pct(b.whiff_pct)})</span></td><td class="n">${a.bbe ? a.hard + " of " + a.bbe : "—"} <span class="muted">(${pct(b.hard_pct)})</span></td></tr>`; }).join("");
  return frame(`${lbl("By pitch type · this week (season %)", "i")}<div class="scroll"><table class="t" style="margin-top:6px"><thead><tr><th class="l">Pitch</th><th>Seen</th><th>Swings</th><th>Whiffs</th><th>Hard contact</th></tr></thead><tbody>${rows}</tbody></table></div>`, "", "flex:1.4 1 380px;min-width:0");
}
const legendDrift = cage => `<div class="legend" style="margin-top:6px"><span><i class="sw" style="background:${C.ink};border-radius:50%"></i>Games</span>${cage ? `<span><i class="sw" style="border:1.4px solid ${C.amber}"></i>Cage, machine at a 90+ look</span>` : ""}<span><i style="width:16px;border-top:1.5px dashed ${C.cyan}"></i>His target</span></div>`;
const legendSpray = `<div class="legend" style="margin-top:6px"><span><i class="sw" style="background:${C.cyan};border-radius:50%"></i>95+ mph</span><span><i class="sw" style="border:1.4px solid ${C.ink2};border-radius:50%"></i>Under 95</span><span><i class="sw" style="border:1.6px solid ${C.amber}"></i>Pop-up</span></div>`;

/* ---------- views ---------- */
const TABS = [["team","Team"],["hitters","Hitters"],["opponent","Opponent"],["practice","Practice"],["roster","Roster"],["program","Program"]];
function viewTeam() {
  const T = DATA.team, w = T.week, p = T.prior, s = T.season;

  const sess = h.session.lines.map(r => `<div style="font-family:${FD};font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase;padding:9px 0 3px;border-top:1px solid ${C.line}">${esc(r.round.replace(/ — /g, " · "))}</div>` + r.lines.map(l => `<div style="display:flex;align-items:center;gap:10px;padding:3px 0 3px 12px"><div class="small ink2" style="flex:1">${esc(l.metric)}</div><div class="mono small" style="width:120px;text-align:right">${esc(l.value)}</div><div class="small muted" style="width:96px;text-align:right">${esc(l.target)}</div><div style="width:70px;text-align:right">${l.met ? chip("Met", "cyan") : chip("Missed", "coral")}</div></div>`).join("")).join("");
  const T = h.tests;
  const trow = (name, f, tgt) => `<tr><td class="l ink2">${name}</td>${T.map((t, i) => `<td class="n" style="color:${i === T.length - 1 ? C.ink : ""}">${f(t)}</td>`).join("")}<td class="n c-cyan">${tgt}</td></tr>`;
  return `<div class="head"><div><h1 class="h1">Practice scoring</h1><div class="small ink2" style="margin-top:6px">Every BP, machine and live round scored against each hitter's own targets.</div></div><div class="head-r">${chip("Sample · fictional roster", "amber")}<div class="wk">WEDNESDAY</div></div></div>
    <div class="row">${frame(`${lbl("Team · targets met Wednesday", "i")}<div class="xs muted" style="margin-top:3px">Pick a hitter to see his session.</div><div style="display:flex;flex-direction:column;gap:2px;margin-top:8px">${rows}</div>`, "", "flex:1 1 320px;min-width:0")}
      ${frame(`<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap">${lbl(h.name + " · Wednesday session", "i")}<span class="mono c-cyan">${h.session.met} of ${h.session.total} targets met</span></div><div style="display:flex;justify-content:flex-end;gap:10px;padding-right:80px;margin-top:6px" class="lbl xs"><span style="width:120px;text-align:right">Result</span><span style="width:96px;text-align:right">Target</span></div>${sess}<p class="xs muted" style="margin-top:10px">Practice numbers show the work. Game numbers decide whether a fix counts. <a href="#/hitter/${h.slug}">Open his card →</a></p>`, "", "flex:1.6 1 440px;min-width:0")}</div>
    <div class="mt">${frame(`${lbl("Monthly test day · " + h.name, "i")}<div class="xs muted" style="margin-top:3px">Same stations, same order, every month.</div><div class="scroll"><table class="t" style="margin-top:6px"><thead><tr><th class="l">Station</th>${T.map(t => `<th>${t.month}</th>`).join("")}<th>Target</th></tr></thead><tbody>
      ${trow("Tee, max intent · best of 5 (mph)", t => t.tee_best.toFixed(1), "103+")}${trow("Machine 90+ look · contact point (in.)", t => inch(t.fb_depth), "+8")}${trow("Machine, top third · pop-ups", t => t.fb_pu + "/" + t.fb_contact, "≤ 10%")}${trow("Machine mix · breaking balls chased", t => t.chase + "/" + t.chase_n, "≤ 28%")}${trow("BP · 10–25° to the middle", t => t.mid + "/" + t.mid_n, "30%+")}
      </tbody></table></div>`)}</div>`;
}
function viewRoster() {
  const p = DATA.portal, d = DATA.draft, rk = p.rank, wb = p.whiff_by_type;
  const rbar = (label, val, key) => { const [r, n] = rk[key], frac = (n - r) / (n - 1), good = r <= 3, bad = r >= n - 2, col = good ? C.cyan : bad ? C.coral : C.cyanD;
    return `<div style="display:flex;align-items:center;gap:12px;margin-top:9px"><div class="small ink2" style="width:150px;flex:none">${label}</div><div class="mono" style="width:62px;text-align:right">${val}</div><div class="bar"><div style="width:${Math.max(frac, .05) * 100}%;background:${col}"></div></div><div style="width:84px;text-align:right;font-family:${FD};font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:${good ? C.cyan : bad ? C.coral : C.ink2}">${ord(r)} of ${n}</div></div>`; };
  const line = (tag, c, html) => `<div style="display:flex;gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid ${C.line}"><div style="width:84px;flex:none">${chip(tag, c)}</div><div class="ink2" style="font-size:14.5px">${html}</div></div>`;
  const s90 = d.s90, nw = d.whiff_by_type;
  const stat = (v, l, sub, col) => `<div><div class="lbl xs">${l}</div><div class="mono" style="font-size:26px;color:${col || C.ink};margin-top:4px">${v}</div><div class="xs muted" style="margin-top:2px">${sub}</div></div>`;
  return `<div class="head"><div><h1 class="h1">Roster reads</h1><div class="small ink2" style="margin-top:6px">Transfer and recruit bats on your roster's scale. Draft readiness for juniors.</div></div><div class="head-r">${chip("Sample · fictional players", "amber")}</div></div>
    <div class="row">${frame(`${lbl("Portal read", "c")}<div class="h2" style="margin-top:6px">${esc(p.name)}</div><div class="sub" style="font-size:14px;margin-top:4px">OF · Bats ${p.bats} · ${p.yr}</div><div class="xs muted" style="margin-top:6px">${p.pa} plate appearances · ${p.bbe} balls in play · average fastball faced ${p.fb_velo.toFixed(1)} mph</div>
        ${rbar("Top-end exit speed", p.ev90.toFixed(1), "ev90")}${rbar("Hard contact (95+)", pct(p.hard_pct), "hard_pct")}${rbar("Launch 10–25°", pct(p.ld_pct), "ld_pct")}${rbar("Chase", pct(p.chase_pct), "chase_pct")}${rbar("Whiffs", pct(p.whiff_pct), "whiff_pct")}
        <div class="xs muted" style="margin-top:8px">Ranked among your ${rk.ev90[1] - 1} regulars plus him; a longer bar is a better rank.</div>
        <div style="margin-top:10px">${line("Fits", "cyan", `<b class="c-ink">Impact bat.</b> Top three on your roster in top-end exit speed, hard contact and line-drive launch.`)}${line("Question", "coral", `<b class="c-ink">Swing-and-miss on soft stuff:</b> ${pct(wb.Breaking.pct)} whiffs on breaking balls and ${pct(wb.Changeup.pct)} on changeups. Fastballs are fine: ${pct(wb["FB 90+"].pct)} whiffs against 90+.`)}</div>`, "", "flex:1.3 1 460px;min-width:0")}
      ${frame(`${lbl("Draft read", "c")}<div class="h2" style="margin-top:6px">${esc(d.name)}</div><div class="sub" style="font-size:14px;margin-top:4px">C · ${d.yr} · draft-eligible</div>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:12px">${stat(d.ev90.toFixed(1), "Top-end exit speed", "max " + d.ev_max.toFixed(1) + " mph")}${stat(pct(s90.hard_pct), "Hard contact vs 90+", s90.hard + " of " + s90.bbe + " in play", C.cyan)}${stat(pct(d.chase), "Chase", "season to date")}${stat(pct(d.whiff), "Whiffs", pct(nw["FB 90+"].pct) + " vs 90+", C.coral)}</div>
        <p class="small ink2" style="margin-top:12px"><b class="c-ink">Handles velocity:</b> ${nw["FB 90+"].whiffs} whiffs in ${nw["FB 90+"].swings} swings against 90+. <b class="c-ink">Fix before spring:</b> misses on everything slower: fastballs under 90 (${pct(nw["FB <90"].pct)}), breaking balls (${pct(nw.Breaking.pct)}), changeups (${pct(nw.Changeup.pct)}).</p>
        <p style="margin-top:10px"><a class="btn" href="#/hitter/eli-navarro">His weekly card →</a></p>`, "", "flex:1 1 340px;min-width:0")}</div>
    <p class="xs muted mt">A read is only as good as the data behind it. Every read says how many balls it is built on.</p>`;
}
function viewProgram() {
  const prod = (n, name, desc, link, label) => frame(`<div style="display:flex;gap:10px"><div class="num">${n}</div><div><div class="h3" style="font-size:20px">${esc(name)}</div><p class="small ink2" style="margin-top:4px">${esc(desc)}</p>${link ? `<p style="margin-top:8px"><a href="${link}" class="small">${esc(label)} →</a></p>` : ""}</div></div>`);
  return `<div class="head"><div style="max-width:720px">${lbl("For college & university programs", "c")}<h1 class="h1" style="margin-top:8px">A plan for every hitter. A card every Monday. <span class="c-cyan">A plan for every starter.</span></h1>
      <p class="ink2" style="margin-top:12px;font-size:16px">Your stadium tracking already records every ball your hitters put in play: how hard, at what angle, and where the bat met it. We turn that into development plans, practice scoring, weekly cards and opponent plans, built by the same people who do our pro hitting and pitching work.</p></div></div>
    <div class="lbl c mb">Development & performance</div>
    <div class="prod">${prod("01", "Hitter development plan", "Baseline from fall data, what's costing him, 3–5 fixes with drills and targets, a retest every 4 weeks.", "#/hitter/danny-ortega", "See a plan")}${prod("02", "Contact-point profile", "Where he meets fastballs and breaking balls, and what the ball does from there: a read on the swing path without bat sensors.", "#/hitter/danny-ortega", "See a profile")}${prod("03", "Practice scoring", "Every BP, machine and live round scored against his targets. Monthly test day.", "#/practice", "See practice scoring")}</div>
    <div class="lbl c mb mt2">Gameday intel</div>
    <div class="prod">${prod("04", "Opponent pitcher plans", "The weekend starter's mix, shapes and plan, plus which of your pitchers matches him for live BP and machine settings for the rest.", "#/opponent", "See an opponent plan")}${prod("05", "Weekly hitter cards", "A Monday card for every hitter and a page for the coaches, with flags when something slips.", "#/team", "See the team page")}</div>
    <div class="lbl c mb mt2">Roster</div>
    <div class="prod">${prod("06", "Portal & recruit reads", "Transfer and recruit bats on your roster's scale. Draft-readiness reports for juniors.", "#/roster", "See the reads")}</div>
    <div class="row mt2">${frame(`${lbl("The team package · one team price", "c")}<ul class="bul" style="margin-top:10px"><li>Plans and contact-point profiles for the everyday lineup</li><li>Practice scoring and Monday cards for the whole roster</li><li>Opponent plans for every weekend series in season</li></ul>`, "", "flex:1.3 1 360px;min-width:0")}
      ${frame(`${lbl("Add-ons", "a")}<ul class="bul a" style="margin-top:10px"><li>Portal, recruit and draft-readiness reads</li><li>Mechanics assessment at our facility: motion capture and high-speed video</li><li>Bat sensors merged with contact data: bat speed and attack angle at every contact point</li></ul>`, "amber", "flex:1 1 320px;min-width:0")}</div>
    <div class="mt2">${lbl("A year with us")}<div class="row" style="gap:8px;margin-top:8px">${[["Fall","Baseline","Scrimmages and live BP"],["After baseline","Plans out","Fixes, drills, targets"],["Winter","Practice scoring","Monthly test days"],["Feb – June","In season","Monday cards and weekend plans"]].map((s, i) => `<div style="flex:1 1 200px;border-top:2px solid ${i === 3 ? C.cyan : C.cyanD};padding:8px 10px 0">${lbl(s[0], i === 3 ? "c" : "")}<div class="h3" style="margin-top:4px">${s[1]}</div><div class="small ink2">${s[2]}</div></div>`).join("")}</div></div>
    <div class="row mt2" style="gap:26px"><div class="grow">${lbl("What we need from you", "c")}<ul class="bul" style="margin-top:10px"><li>Tracking on in games and every practice round</li><li>Pitch calls tagged in live practice at-bats</li><li>Batter and round labels; lineups and the schedule</li></ul></div>
      <div class="grow">${lbl("How we work", "c")}<ul class="bul" style="margin-top:10px"><li>A fix counts when it shows up in games, not just in the cage.</li><li>Benchmarks start with your own roster; other schools only with your permission.</li><li>Every number says how much data it is built on.</li></ul></div></div>
    <div class="mt2 callout">${esc(DATA.meta.contact)}</div>`;
}

/* ---------- router ---------- */
function route() {
  const parts = (location.hash || "#/team").replace(/^#\/?/, "").split("/");
  const page = parts[0] || "team", arg = parts[1];
  const active = page === "hitter" ? "hitters" : page;
  document.getElementById("tabs").innerHTML = TABS.map(([k, t]) => `<a href="#/${k}" ${k === active ? 'aria-current="page"' : ""}>${t}</a>`).join("");
  const v = document.getElementById("view");
  const html = page === "hitters" ? viewHitters() : page === "hitter" ? viewHitter(arg) : page === "opponent" ? viewOpponent() : page === "practice" ? viewPractice(arg) : page === "roster" ? viewRoster() : page === "program" ? viewProgram() : viewTeam();
  v.innerHTML = html;
  const titles = {team:"Team page", hitters:"Hitters", hitter: arg && BY[arg] ? BY[arg].name : "Hitter", opponent:"Opponent plan", practice:"Practice scoring", roster:"Roster reads", program:"Program"};
  document.title = (titles[page] || "Team page") + " · College Hitting Dashboard · No Brand Baseball Analytics";
}
document.getElementById("view").addEventListener("click", e => {
  const b = e.target.closest("[data-sort],[data-scope],[data-spray],[data-pr],[data-print]");
  if (!b) return;
  if (b.dataset.sort) { const k = b.dataset.sort; if (state.sort === k) { if (state.flipped) { state.sort = null; state.flipped = false; } else { state.dir = -state.dir; state.flipped = true; } } else { state.sort = k; state.flipped = false; state.dir = (k === "chase_pct" || k === "whiff_pct" || k === "num") ? 1 : -1; } route(); }
  else if (b.dataset.scope) { state.scope = b.dataset.scope; route(); }
  else if (b.dataset.spray) { state.spray = b.dataset.spray; route(); }
  else if (b.dataset.pr) { location.hash = "#/practice/" + b.dataset.pr; }
  else if (b.hasAttribute("data-print")) { window.print(); }
});
let lastPage = null, lastNarrow = narrow(), rt = null;
window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (narrow() !== lastNarrow) { lastNarrow = narrow(); route(); } }, 150); });
window.addEventListener("hashchange", () => { const pg = location.hash.split("/")[1]; route(); if (pg !== lastPage) window.scrollTo(0, 0); lastPage = pg; });
document.getElementById("hdr-meta").innerHTML = `${esc(DATA.meta.team)} · <b>Week ${DATA.meta.week}</b> · ${esc(DATA.meta.dates)}`;
document.getElementById("ft-contact").textContent = "No Brand Baseball Analytics · " + DATA.meta.contact;
route();
})();
</script>
